<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="fonts.css" />
<style>
  :root{
    /* ===== Tokens da marca Marcelo Matos | Dev & IA (v5 — terminal/brutalista) ===== */
    --bg:#0a0617;
    --ciano:#2fcfe9;           /* eyebrow + CTA (contraste alto p/ thumbnail) */
    --grad-a:#46a0f0;          /* início do gradiente do título (azul-ciano) */
    --grad-b:#a85cf2;          /* fim do gradiente do título (roxo) */
    --texto:#ffffff;
    --corpo:#e4e0f4;           /* corpo: lavanda quase branca — leitura no grid */
    --suave:#8d86a8;           /* handle / legendas discretas */
    --linha:rgba(255,255,255,.28);
    --mono:'DejaVu Sans Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px}
  .canvas{
    position:relative;width:1080px;height:1350px;overflow:hidden;
    background:
      radial-gradient(120% 80% at 8% 0%, rgba(123,58,236,.40) 0%, rgba(123,58,236,0) 46%),
      radial-gradient(110% 75% at 100% 4%, rgba(29,147,184,.40) 0%, rgba(29,147,184,0) 44%),
      var(--bg);
    color:var(--texto);
    font-family:'Inter',sans-serif;
    padding:48px;
  }
  /* malha de fundo sutil */
  .canvas::before{
    content:"";position:absolute;inset:0;opacity:.06;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.16) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.16) 1px,transparent 1px);
    background-size:60px 60px;
  }

  /* ícone temático de fundo — apagado, atrás da moldura */
  .bgicon{
    position:absolute;top:95px;right:-10px;z-index:0;
    font-size:440px;line-height:1;opacity:.11;pointer-events:none;
    filter:saturate(.85);
  }
  /* foto de fundo (por lâmina) — abaixo do frame, acima do emoji-fallback */
  .photo{position:absolute;inset:0;z-index:1;background-size:cover;background-position:center}
  .scrim{position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg,rgba(10,6,23,.55) 0%,rgba(10,6,23,.82) 55%,rgba(10,6,23,.96) 100%);}

  /* ===== Moldura "janela de editor" (identidade v5) ===== */
  .frame{
    position:relative;z-index:2;width:100%;height:100%;
    border:2px solid var(--linha);
    display:flex;flex-direction:column;
  }
  .corner{position:absolute;width:34px;height:34px;border-color:var(--ciano);z-index:3;pointer-events:none}
  .corner.tl{top:-2px;left:-2px;border-top:4px solid;border-left:4px solid}
  .corner.tr{top:-2px;right:-2px;border-top:4px solid;border-right:4px solid}
  .corner.bl{bottom:-2px;left:-2px;border-bottom:4px solid;border-left:4px solid}
  .corner.br{bottom:-2px;right:-2px;border-bottom:4px solid;border-right:4px solid}

  .winbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:26px 34px;border-bottom:2px solid var(--linha);
  }
  .brand{display:flex;align-items:center;gap:20px}
  .logo{width:64px;height:64px;flex:none;display:block}
  .who .path{font-family:var(--mono);font-size:26px;color:var(--suave)}
  .who .path b{color:var(--texto)}
  /* bolinhas de progresso (só em carrossel) — quadradas, no estilo da moldura */
  .dots{display:flex;align-items:center;gap:12px}
  .dot{width:16px;height:16px;border:2px solid var(--linha)}
  .dot.on{background:var(--ciano);border-color:var(--ciano);box-shadow:0 0 14px rgba(47,207,233,.7)}

  /* ===== Corpo central ===== */
  .mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:64px 60px}
  .eyebrow{
    font-family:var(--mono);font-weight:700;font-size:30px;
    color:var(--ciano);margin-bottom:30px;display:flex;align-items:center;gap:2px;
  }
  .eyebrow::before{content:"$ ";color:var(--suave)}
  .eyebrow::after{content:"";display:inline-block;width:16px;height:32px;background:var(--ciano);margin-left:8px}
  .title{
    font-family:'Poppins',sans-serif;font-weight:800;font-size:var(--title-size,96px);
    line-height:1.03;letter-spacing:-1.5px;
    background:linear-gradient(96deg,var(--grad-a) 0%,var(--grad-b) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 14px rgba(0,0,0,.9));
  }
  .body{font-family:var(--mono);font-size:36px;line-height:1.55;color:var(--corpo);
    margin-top:36px;max-width:860px;border-left:3px solid var(--ciano);padding-left:24px;
    text-shadow:0 2px 8px rgba(0,0,0,.85)}
  .list{margin-top:40px;display:flex;flex-direction:column;gap:22px}
  .list .item{display:flex;align-items:center;gap:22px;font-family:var(--mono);font-size:36px;color:var(--texto);
    text-shadow:0 2px 8px rgba(0,0,0,.85)}
  .list .item .ic{font-size:42px;line-height:1;width:56px;text-align:center;flex:none}
  .list .item.step .ic{
    font-family:var(--mono);font-weight:700;font-size:30px;color:var(--ciano);
    width:60px;height:60px;border:2px solid var(--ciano);display:flex;align-items:center;justify-content:center;
    background:rgba(47,207,233,.08);
  }

  /* ===== Rodapé ===== */
  .foot{padding:30px 34px;border-top:2px solid var(--linha)}
  .foot .row{display:flex;align-items:center;justify-content:space-between;gap:24px}
  .foot .at{font-family:var(--mono);font-size:30px;color:var(--suave)}
  .foot .at b{color:var(--texto)}
  .foot .cta{
    font-family:var(--mono);font-weight:700;font-size:28px;color:#07121a;
    text-transform:uppercase;
    padding:16px 28px;white-space:nowrap;background:var(--ciano);
  }
  .foot .cta::before{content:"[ "}
  .foot .cta::after{content:" ]"}
</style>
</head>
<body>
  <div class="canvas">
    <div class="bgicon">{{BG_ICON}}</div>
    {{PHOTO_LAYER}}
    <div class="frame">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <div class="winbar">
        <div class="brand">
          <img class="logo" src="{{LOGO_SRC}}" alt="" />
          <div class="who"><div class="path"><b>marcelomatos</b>/automacao.sh</div></div>
        </div>
        {{PROGRESS}}
      </div>

      <div class="mid">
        <div class="eyebrow">{{EYEBROW}}</div>
        <div class="title">{{TITLE}}</div>
        {{CONTENT}}
      </div>

      <div class="foot">
        <div class="row">
          <div class="at">@<b>marcelomatos.dev</b></div>
          <div class="cta">{{CTA}}</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
