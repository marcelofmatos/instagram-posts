<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="fonts.css" />
<style>
  :root{
    --bg:#0a0617;
    --ciano:#2fcfe9;
    --grad-a:#46a0f0;
    --grad-b:#a85cf2;
    --texto:#ffffff;
    --corpo:#e4e0f4;
    --suave:#8d86a8;
    --linha:rgba(255,255,255,.20);
    --add:#3ddc84;
    --mono:'DejaVu Sans Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px}
  .canvas{
    position:relative;width:1080px;height:1920px;overflow:hidden;
    background:
      radial-gradient(120% 60% at 8% 0%, rgba(123,58,236,.40) 0%, rgba(123,58,236,0) 46%),
      radial-gradient(110% 55% at 100% 4%, rgba(29,147,184,.40) 0%, rgba(29,147,184,0) 44%),
      var(--bg);
    color:var(--texto);font-family:'Inter',sans-serif;
    padding:72px 64px;display:flex;flex-direction:column;
  }
  .photo{position:absolute;inset:0;z-index:1;background-size:cover;background-position:center}
  .scrim{position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg,rgba(10,6,23,.55) 0%,rgba(10,6,23,.82) 55%,rgba(10,6,23,.96) 100%);}
  .canvas>*:not(.photo):not(.scrim){position:relative;z-index:2}

  .commitbar{display:flex;align-items:center;gap:20px;margin-bottom:60px}
  .logo{width:60px;height:60px;flex:none;display:block}
  .hash{font-family:var(--mono);font-size:28px;color:var(--ciano)}
  .branch{font-family:var(--mono);font-size:28px;color:var(--suave)}
  .branch b{color:var(--texto)}

  .mid{flex:1;display:flex;flex-direction:column;justify-content:center;
    border-left:4px solid var(--linha);padding-left:36px}
  .eyebrow{font-family:var(--mono);font-size:30px;color:var(--suave);margin-bottom:10px;display:flex;gap:2px}
  .eyebrow::before{content:"// "}
  .eyebrow .cursor{display:inline-block;width:16px;height:34px;background:var(--suave);margin-left:8px}
  .title{
    font-family:'Poppins',sans-serif;font-weight:800;font-size:82px;
    line-height:1.05;letter-spacing:-1.5px;margin:18px 0 34px;
  }
  .title .grad{
    background:linear-gradient(96deg,var(--grad-a) 0%,var(--grad-b) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .title .hl{display:inline-block;color:var(--ciano)}
  .diffline{display:flex;gap:20px;align-items:flex-start}
  .diffline .sign{font-family:var(--mono);font-size:40px;font-weight:700;color:var(--add);width:32px;flex:none}
  .diffline .txt{font-family:var(--mono);font-size:36px;line-height:1.5;color:var(--corpo);max-width:820px}

  .foot{margin-top:50px;display:flex;align-items:center;justify-content:space-between}
  .status{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:28px;color:var(--suave)}
  .status .led{width:16px;height:16px;border-radius:50%;background:var(--add);box-shadow:0 0 14px var(--add)}
  .status b{color:var(--texto)}
  .cta{
    font-family:var(--mono);font-weight:700;font-size:30px;color:#07121a;text-transform:uppercase;
    padding:18px 30px;border-radius:10px;background:var(--ciano);white-space:nowrap;
  }
</style>
</head>
<body>
  <div class="canvas">
    {{PHOTO_LAYER}}
    <div class="commitbar">
      <img class="logo" src="{{LOGO_SRC}}" alt="" />
      <div class="hash">#{{COMMIT_HASH}}</div>
      <div class="branch"><b>marcelomatos</b>/main</div>
    </div>
    <div class="mid">
      <div class="eyebrow" style="{{EYEBROW_STYLE}}">{{EYEBROW}}<span class="cursor"></span></div>
      <div class="title" style="{{TITLE_STYLE}}"><span class="grad">{{TITLE_REST}} </span><span class="hl" style="{{TITLE_HL_STYLE}}">{{TITLE_LAST}}</span></div>
      <div class="diffline" style="{{BODY_STYLE}}"><span class="sign">+</span><span class="txt">{{BODY}}</span></div>
    </div>
    <div class="foot">
      <div class="status"><span class="led"></span>@<b>marcelomatos.dev</b></div>
      <div class="cta" style="{{CTA_STYLE}}">{{CTA}}</div>
    </div>
  </div>
</body>
</html>
